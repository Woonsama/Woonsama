<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0a1f"/><stop offset="1" stop-color="#1f1147"/></linearGradient>
<linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#FFB88C"/><stop offset=".55" stop-color="#FF7A90"/><stop offset="1" stop-color="#C77DFF"/></linearGradient>
<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C77DFF" stroke-opacity=".10"/></pattern>
<clipPath id="cp"><rect width="1000" height="300" rx="18"/></clipPath>
