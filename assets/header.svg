  <polygon points="0,0 15.4,-9 110,0 15.4,9" fill="#ffffff" fill-opacity=".9" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.2"/><circle r="10" fill="#0d0a1f" stroke="#5EEAD4" stroke-width="2.5"/><circle r="22" fill="none" stroke="#5EEAD4" stroke-opacity=".5" stroke-dasharray="3 5"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/></circle>
  <g transform="translate(110 0)"><g><animateTransform attributeName="transform" type="rotate" values="10;-55;10" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="5s" begin="0.25s" repeatCount="indefinite"/>
   <polygon points="0,0 13.3,-9 95,0 13.3,9" fill="#ffffff" fill-opacity=".9" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.2"/><circle r="9" fill="#0d0a1f" stroke="#FF7A90" stroke-width="2.5"/>
