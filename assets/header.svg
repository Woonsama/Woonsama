    <polygon points="0,0 9.8,-9 70,0 9.8,9" fill="#ffffff" fill-opacity=".9" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.2"/><circle r="8" fill="#0d0a1f" stroke="#FFB88C" stroke-width="2.5"/>
    <g transform="translate(70 0)"><circle r="7" fill="#FFB88C"/><rect x="-14" y="-14" width="28" height="28" fill="none" stroke="#FFB88C" stroke-opacity=".7" stroke-width="1.5" rx="3"/></g>
   </g></g>
  </g></g>
 </g>
</g>
