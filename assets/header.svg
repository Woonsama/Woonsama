<g clip-path="url(#cp)">
<rect width="1000" height="300" fill="url(#bg)"/>
<g filter="url(#bl)"><circle r="120" fill="#7B2CBF" opacity="0.65"><animate attributeName="cx" values="180;420;180" dur="13s" repeatCount="indefinite"/><animate attributeName="cy" values="70;230;70" dur="10.4s" repeatCount="indefinite"/></circle><circle r="100" fill="#FF7A90" opacity="0.4"><animate attributeName="cx" values="820;560;820" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="240;60;240" dur="8.8s" repeatCount="indefinite"/></circle><circle r="90" fill="#5EEAD4" opacity="0.28"><animate attributeName="cx" values="600;880;600" dur="15s" repeatCount="indefinite"/><animate attributeName="cy" values="40;200;40" dur="12.0s" repeatCount="indefinite"/></circle><circle r="80" fill="#C77DFF" opacity="0.45"><animate attributeName="cx" values="60;300;60" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="250;120;250" dur="8.0s" repeatCount="indefinite"/></circle></g>
<rect x="-40" y="-40" width="1080" height="380" fill="url(#gr)"><animateTransform attributeName="transform" type="translate" values="0 0;40 40" dur="6s" repeatCount="indefinite"/></rect>
